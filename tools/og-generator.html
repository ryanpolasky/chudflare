<!doctype html>
<html lang="en">
<head>
  <meta name="chudflare-verified" content="chud"/>
  <meta charset="utf-8"/>
  <title>OG Image Generator</title>
  <meta property="og:title" content="Chudflare | The Chudmaxxed Cloud"/>
  <meta property="og:description" content="A parody of Cloudflare. Chudflare protects, accelerates, and chudmaxxes any internet application without adding hardware, installing software, or eating salad."/>
  <meta property="og:image" content="https://chudflare.com/assets/img/og-image.jpg"/>
  <meta property="og:url" content="https://chudflare.com/"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

    /* Standard OG image size */
    body {
      margin: 0;
      padding: 0;
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      background: #0B0F14;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
      box-sizing: border-box;
      /* subtle grid background to look technical */
      background-image: 
        linear-gradient(rgba(243, 128, 32, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 128, 32, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      position: absolute;
      top: 60px;
      left: 80px;
    }

    .logo img {
      height: 48px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .content {
      z-index: 10;
      margin-top: 40px;
    }

    h1 {
      font-size: 84px;
      font-weight: 800;
      margin: 0 0 24px 0;
      letter-spacing: -0.03em;
      line-height: 1.05;
      max-width: 900px;
    }

    .subtitle {
      font-size: 36px;
      color: #9CA3AF;
      font-weight: 400;
      max-width: 800px;
      line-height: 1.4;
    }

    .cli {
      font-family: 'JetBrains Mono', monospace;
      color: #F38020;
      font-size: 24px;
      margin-top: 48px;
    }

    .mascot-bg {
      position: absolute;
      right: -80px;
      bottom: -60px;
      height: 580px;
      opacity: 0.9;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 16px;
      background: #F38020;
    }
  </style>
</head>
<body>

  <!-- Open this in browser, screenshot the 1200x630 card, and save to assets/img/og-image.jpg -->
  <div class="og-card">
    <div class="logo">
      <img src="../assets/img/chudflare-mascot.png" alt="" />
      <div class="logo-text">Chudflare</div>
    </div>

    <div class="content">
      <h1>Checking canthal tilt...</h1>
      <div class="subtitle">The chudmaxxed cloud. Replacing your VPN, your bastion, and your dignity.</div>
      <div class="cli">> cf-ray: 8c0ffee-CHUD-DEN</div>
    </div>

    <img src="../assets/img/chudflare-mascot.png" class="mascot-bg" alt="" />
    <div class="status-bar"></div>
  </div>

</body>
</html>
